<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F5132">
<title>Aulão ENEM · Responda</title>
<script>try{const t=localStorage.getItem("tema")||"auto";const e=t==="escuro"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);if(e)document.documentElement.dataset.tema="escuro"}catch(e){}</script>
<style>
:root{
  /* Identidade Genoma Prevê (cores tiradas do deck do aulão) */
  --g-dark:#0F5132; --g-deep:#08321E; --g-logo:#4C975C; --o-logo:#DB802D;
  --bg:#EEF3EF; --surface:#FFFFFF; --sunk:#E3EBE5; --ink:#2B2B2B; --muted:#6B6B6B; --line:#D6E0D9;
  --blue:#3C8C4D; --blue-deep:#0F5132; --blue-soft:#E1F0E4;
  --tang:#E7632D; --tang-soft:#FBEFE3; --violet:#7E5CBA; --violet-soft:#EEE8F7;
  --amber:#BF7129; --amber-soft:#FBEFE3; --mint:#2E8B57; --mint-soft:#DDF0E3;
  --danger:#D2373C; --danger-soft:#FBE3E3; --r:14px; --r-sm:8px;
  --sky:#2E7D9A; --pink:#BF7129; --teal:#2E7D9A;
  --f-ui:Arial, "Helvetica Neue", Helvetica, sans-serif; --f-num:Arial, "Helvetica Neue", Helvetica, sans-serif;
  --trap-ink:#8A4F14; --ok-ink:#1F6B3C;
}
:root[data-tema="escuro"]{
  --bg:#06140C; --surface:#0E2017; --sunk:#16301F; --ink:#E7EFE9; --muted:#9FB3A5; --line:#1F3B2A;
  --blue:#56B06A; --blue-soft:#163A22; --tang:#F07A45; --tang-soft:#3A2015;
  --violet:#A98BE0; --violet-soft:#2A2240; --amber:#E0954A; --amber-soft:#3A2914;
  --mint:#4CC27F; --mint-soft:#103A24; --danger:#FF6A6E; --danger-soft:#3D1A1D; color-scheme:dark;
  --trap-ink:#F0B070; --ok-ink:#6FD69A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui)}
.num,.count,.bar .n,.stat b,.dot{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 90px}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:linear-gradient(120deg,var(--g-dark),var(--g-deep));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(8,50,30,.25)}
.top b{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.top .marca{height:34px;width:auto;display:block}
.top .tema{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.logo-g{display:block;height:56px;width:auto;margin:18px auto 4px;border-radius:10px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--mint-soft);color:var(--ok-ink)}
.pill.warn{background:var(--amber-soft);color:var(--trap-ink)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.hero{background:radial-gradient(120% 140% at 85% 0%,#1C6B43 0%,var(--g-dark) 45%,var(--g-deep) 100%);color:#fff;border:0}
.hero h1{margin:0 0 4px;font-size:22px;line-height:1.2}
.hero p{margin:0;opacity:.92}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 8px}
.area{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:8px;color:#fff;background:var(--blue)}
.qhead h2{margin:0;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.qhead .h{font-size:13px;color:var(--muted)}
.slide{display:block;width:100%;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;margin:6px 0}
.zoomhint{font-size:13px;color:var(--muted);text-align:center;margin:2px 0 10px}
.alts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.alt{height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:26px;font-weight:800;cursor:pointer}
.alt[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.alt:disabled{cursor:default;opacity:.55}
.alt.certa{background:var(--mint);border-color:var(--mint);color:#fff;opacity:1}
.alt.errada{background:var(--danger);border-color:var(--danger);color:#fff;opacity:1}
.status{text-align:center;font-size:14px;margin-top:10px;color:var(--muted);min-height:20px}
.big{font-size:20px;font-weight:700;margin:0 0 6px}
.panel>.big:first-child{display:flex;align-items:center;gap:9px;font-size:17px;margin-bottom:10px}
.panel>.big:first-child::before{content:"";flex:none;width:4px;height:18px;border-radius:2px;background:var(--hc,var(--blue))}
.panel.hero>.big:first-child::before{background:#fff}
.tema{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
#layer{position:fixed;inset:0;z-index:30;display:none;background:rgba(11,16,32,.45)}
#layer.on{display:block}
#layer .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px 28px;animation:sobe .22s ease-out}
#layer .sheet .sx{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 0;z-index:2}
#layer .sheet .sx button{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer}
#layer .sheet .wrapin{max-width:760px;margin:0 auto}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.res{border-radius:var(--r);padding:16px;margin:12px 0}
.res.ok{background:var(--mint-soft);border:1px solid var(--mint)}
.res.no{background:var(--danger-soft);border:1px solid var(--danger)}
.res.nada{background:var(--sunk);border:1px solid var(--line)}
.trap{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.trap b{color:var(--trap-ink)}
.fechar{background:var(--violet-soft);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.bars{margin-top:8px}
.bar{display:grid;grid-template-columns:26px 1fr 52px;align-items:center;gap:8px;margin:6px 0;font-weight:700}
.bar .t{height:22px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .f{height:100%;background:#AEB8D6;border-radius:6px;transition:width .4s}
.bar.g .f{background:var(--mint)}
.bar .n{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;margin:8px 0;min-height:48px}
.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.tang{background:var(--tang);border-color:var(--tang);color:#fff}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.dot{min-width:22px;flex:none;text-align:center;font-weight:800}
.dot.ok{color:var(--mint)}.dot.no{color:var(--danger)}.dot.na{color:var(--muted)}
.stat{display:flex;gap:10px;margin-top:10px}
.stat div{flex:1;background:rgba(255,255,255,.16);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}
#viewer{position:fixed;inset:0;background:#0B1020;z-index:50;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .vbar{display:flex;gap:8px;padding:8px;background:#131A2E}
#viewer .vbar button{flex:1;min-height:44px;border-radius:10px;border:0;background:#252F4A;color:#fff;font-weight:700;font-size:18px}
#viewer .vbar button.x{background:var(--tang)}
#viewer .vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#viewer img{display:block;max-width:none;background:#fff}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);margin:6px 0;background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;display:none}
/* professor */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.qbtn{padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;line-height:1.2}
.qbtn small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.qbtn.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qbtn.cur small{color:var(--line)}
.qbtn.done{background:var(--mint-soft)}
.fase{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.count{font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pwrap{max-width:1100px}
.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 6px}
.agora{border-top:4px solid var(--hc)}
.agora-g{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:760px){.agora-g{grid-template-columns:1fr}}
.pill.gab{background:var(--g-dark);color:#fff;font-size:14px;padding:6px 12px}
.bloco{border-left:5px solid var(--hc)}
.bloco-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.qcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.qcard.cur{border:2px solid var(--hc);box-shadow:0 0 0 3px color-mix(in srgb,var(--hc) 20%,transparent)}
.qcard.done{background:var(--sunk)}
.qcard .thumb{height:118px;overflow:hidden;background:#fff;cursor:zoom-in;border-bottom:1px solid var(--line)}
.qcard .thumb img{width:100%;display:block}
.qcard .qinfo{padding:10px 12px 0;flex:1;line-height:1.35}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;min-height:48px;text-align:left}
.tab small{font-weight:500;color:var(--muted);font-size:12px}
.tab[aria-pressed="true"]{background:var(--g-dark);border-color:var(--g-dark);color:#fff}
.tab[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.sdesc{margin:4px 2px 0;font-size:13.5px;color:var(--muted)}
.star{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{background:var(--o-logo);border-color:var(--o-logo);color:#fff}
.qcard{position:relative}
.dif{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;margin-left:4px;vertical-align:1px}
.dif.m{background:#BF7129}.dif.d{background:#7E5CBA}.dif.f{background:#2E8B57}
.cardshare{display:block;width:100%;max-width:360px;margin:0 auto 12px;border-radius:18px;box-shadow:0 10px 30px rgba(8,50,30,.35);aspect-ratio:9/16;background:var(--g-deep)}
.pill.on{background:#E3F4E8;color:#0F5132}
.surpresa{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px 40px;background:radial-gradient(120% 90% at 85% 0%,#1C6B43 0%,#0F5132 45%,#08321E 100%);color:#fff;text-align:center;animation:surge 1.2s ease-out}
.surpresa .ttl{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;background:var(--tang);padding:6px 14px;border-radius:999px}
.surpresa img.poema{width:100%;max-width:440px;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.35);background:#fff;animation:surge 1.6s ease-out}
.surpresa .ass{font-size:26px;font-style:italic;font-family:Georgia,"Times New Roman",serif;margin:6px 0 0;animation:surge 2.6s ease-out}
.surpresa .ass b{display:block;font-style:normal;font-family:var(--f-ui);font-size:30px;margin-top:2px}
@keyframes surge{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#telao .poema{max-height:72vh;max-width:44vw;border-radius:16px;background:#fff}
.fimtela{gap:12px;padding-top:16px}
.cardfull{display:block;height:calc(100svh - 250px);min-height:360px;max-width:100%;aspect-ratio:9/16;object-fit:contain;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.4);background:#08321E;animation:surge 1s ease-out}
.mono{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;color:#fff;font:800 .8em/1 var(--f-ui);letter-spacing:.02em;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.codinome .bx .mono,.deg .bx .mono{font-size:22px}
#telao .tpod .deg .bx .mono{font-size:5vh}
.rank .bx .mono{font-size:13px}
.quase{display:flex;gap:10px;width:100%;max-width:460px;position:relative;z-index:2;animation:surge .8s 2.3s both}
.quase>div{flex:1;min-width:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 8px;display:flex;align-items:center;gap:8px;text-align:left}
.quase .ps{font:900 24px var(--f-num)}
.quase .nm{font-weight:800;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.quase .pt{font-size:12px;opacity:.8}
.quase .eu-aqui{background:#fff;color:var(--g-dark)}
.mencoes{width:100%;max-width:460px;position:relative;z-index:2;animation:surge .8s 2.8s both;text-align:left}
.mencoes .lbl{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.75;margin:4px 0 6px;text-align:center}
.mencoes ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mencoes li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:14px}
.mencoes li b{flex:1}
.mencoes li.eu-aqui{background:#fff;color:var(--g-dark)}
.mencao{background:radial-gradient(120% 80% at 50% 0%,#CFE6FF 0%,#5B9BDB 45%,#1F4E86 100%);color:#fff}
.mencao .ttl{background:#fff;color:#1F4E86}
.mencao .brinde{color:#1F4E86}
#telao .tpod .quase{max-width:80vw;animation-delay:2.3s}#telao .tpod .quase .nm{font-size:3vh}#telao .tpod .quase .ps{font-size:4.5vh}#telao .tpod .quase .pt{font-size:2.2vh}
#telao .tpod .mencoes{max-width:80vw}#telao .tpod .mencoes ul{grid-template-columns:repeat(3,1fr)}#telao .tpod .mencoes li{font-size:2.6vh}#telao .tpod .mencoes .lbl{font-size:2vh}
.convite{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px;background:rgba(6,36,22,.92);backdrop-filter:blur(6px);color:#fff;text-align:center;animation:surge .5s ease-out}
.convite h3{margin:0;font-size:24px;letter-spacing:-.01em}
.convite p{margin:0;opacity:.85;max-width:380px}
.convite img{height:min(56svh,520px);aspect-ratio:9/16;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.45);animation:sobe .7s .15s both}
.convite .btn{max-width:380px}
.eu{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:4px 10px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.codinome{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:linear-gradient(120deg,#FFF4E8,#FFE3C7);border:1px solid #F4C79A;color:#5A2E0C}
.codinome .bx{font-size:46px;line-height:1}
.codinome b{display:block;font-size:22px;letter-spacing:-.01em}
.dica-rot{font-size:14.5px;color:var(--muted);text-align:center;margin:4px 8px 0;min-height:42px;transition:opacity .4s}
.podio{position:relative;overflow:hidden;min-height:calc(100svh - 58px);display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px 34px;text-align:center;color:#fff;background:radial-gradient(130% 90% at 80% 0%,#1F7A4C 0%,#0F5132 48%,#072B19 100%)}
.podio .ttl{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;background:var(--tang);padding:6px 14px;border-radius:99px;position:relative;z-index:2}
.podio h2{font-size:30px;line-height:1.05;margin:2px 0 0;letter-spacing:-.02em;position:relative;z-index:2}
.podio .sub{margin:0;opacity:.8;font-size:14px;position:relative;z-index:2}
.degraus{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;max-width:460px;margin-top:8px;position:relative;z-index:2}
.deg{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;animation:sobe .8s cubic-bezier(.2,.9,.3,1.2) both}
.deg .bx{font-size:46px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.deg .nm{font-weight:800;font-size:15px;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.deg .pt{font-size:12.5px;opacity:.85;margin-bottom:4px}
.deg .bloco{width:100%;border-radius:14px 14px 4px 4px;display:flex;justify-content:center;padding-top:10px;font:900 36px var(--f-num);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.deg.d1{order:2;animation-delay:1.7s}.deg.d2{order:1;animation-delay:.95s}.deg.d3{order:3;animation-delay:.25s}
.deg.d1 .bloco{height:150px;background:linear-gradient(#FFD866,#E9A11A);color:#5C3B00}
.deg.d2 .bloco{height:112px;background:linear-gradient(#F1F4F6,#B6C0C8);color:#38434C}
.deg.d3 .bloco{height:84px;background:linear-gradient(#F2B27A,#BC6A2E);color:#4A2508}
.deg.eu-aqui .nm{background:#fff;color:var(--g-dark);padding:2px 8px;border-radius:8px}
@keyframes sobe{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
.minha-pos{position:relative;z-index:2;width:100%;max-width:460px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;animation:surge 1s 2.3s both}
.minha-pos .n{font:900 34px var(--f-num);min-width:70px;text-align:center}
.campeao{background:radial-gradient(120% 80% at 50% 0%,#FFE48A 0%,#F2A93B 45%,#C9661C 100%);color:#3A2200}
.campeao .ttl{background:#3A2200;color:#FFE48A}
.campeao .medalha{font-size:110px;line-height:1;margin-top:6px;animation:pulo 1.4s ease-in-out infinite;position:relative;z-index:2}
.campeao h2{font-size:38px}
.campeao .brinde{position:relative;z-index:2;background:#fff;color:#3A2200;border-radius:18px;padding:16px 18px;max-width:420px;box-shadow:0 12px 30px rgba(90,40,0,.35);font-size:17px}
.campeao .brinde b{display:block;font-size:21px;margin-bottom:2px}
.cod{font:800 15px var(--f-num);letter-spacing:.18em;opacity:.8;position:relative;z-index:2}
@keyframes pulo{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.confete{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.confete i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:cai linear infinite}
@keyframes cai{to{transform:translateY(115vh) rotate(720deg)}}

      db = fs.initializeFirestore(app, {experimentalForceLongPolling:true});   // mais estável em redes de escola com proxy
      if(precisaAuth){
        A = await import(base+"firebase-auth.js");
        auth = A.initializeAuth(app,{persistence:A.browserLocalPersistence});
      }
    },
    async buscar(){ const d=await fs.getDocFromServer(fs.doc(db,"aulao","estado")); return d.exists()?d.data():null },
    onEstado(cb, erro){
      // se a escuta cair, reabre sozinha
      let des=null; const abre=()=>{ des=fs.onSnapshot(fs.doc(db,"aulao","estado"), s=>cb(s.exists()?s.data():{q:-1,fase:"espera",s:"inicial"}), e=>{ erro&&erro(e); setTimeout(abre,3000) }) };
      abre(); return ()=>des&&des();
    },
    enviar(id,dados){ return fs.setDoc(fs.doc(db,"respostas",id), {...dados, t:fs.serverTimestamp()}); },
    async login(email,senha){ const c=await A.signInWithEmailAndPassword(auth,email,senha); return c.user },
    usuarioAtual(){ return new Promise(res=>{const u=A.onAuthStateChanged(auth,x=>{u();res(x)})}) },
    async sair(){ await A.signOut(auth) },
    setEstado(e){ return fs.setDoc(fs.doc(db,"aulao","estado"), e) },
    ouvirRespostas(k,cb){ return fs.onSnapshot(fs.query(fs.collection(db,"respostas"), fs.where("k","==",k)), s=>cb(s.docs.map(d=>d.data()))) }
  };
})();

function aluno(){

  async function enviarPendentes(){
    if(!sessao) return;
    for(const [i,m] of Object.entries(minhas)){
      if(m.enviado || m.tarde) continue;
      const k = sessao+"_"+i;
      try{ await comPrazo(BE.enviar(k+"_"+dev,{d:dev,k,r:m.r}),15000); m.enviado=true; salvar(); desenha(); }
      catch(e){ /* tenta de novo depois */ }
    }
  }
  setInterval(enviarPendentes, 8000);
  // presença: um "sinal de vida" a cada 25 s enquanto a página estiver aberta na tela
  async function batida(){
    if(!sessao || document.hidden) return;
    try{ await comPrazo(BE.enviar(sessao+"_on_"+dev,{d:dev,k:sessao+"_on",r:"A"}),10000) }catch(e){}
  }
  setInterval(batida, 40000);
  setInterval(()=>{ const el=$("#dicarot"); if(!el) return; el.style.opacity=0; setTimeout(()=>{ el.textContent=fr("espera",dev+Math.floor(Date.now()/9000)); el.style.opacity=1 },400) }, 9000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) batida() });
  addEventListener("online", enviarPendentes);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) enviarPendentes() });

  function marcar(l){
    if(!E || E.fase!=="aberta") return;
    const i = E.q, ant = minhas[i];
    if(ant && ant.r===l) return;
    const tr = ant ? (ant.tr||0)+1 : 0;
    minhas[i] = {r:l, enviado:false, tr};
    salvar(); desenha(); enviarPendentes();
    const sem = dev+i+l+tr;
    toast(tr===0 ? fr("marca",sem,{L:l}) : tr>=3 ? fr("muito",sem,{n:tr}) : fr("troca",sem,{L:l}));
  }

  function resumoHTML(){
    const feitas = Q.map((q,i)=>({q,i,m:minhas[i]})).filter(x=>x.m && x.m.revelada);
    if(!feitas.length) return `<p class="muted">Seu desempenho aparece aqui depois do primeiro gabarito.</p>`;
    const ac = feitas.filter(x=>x.m.r===x.q.gab).length;

    const armas = {};
    feitas.forEach(x=>{ if(x.m.r && x.m.r!==x.q.gab){ const a=x.q.arm[x.m.r]; if(a) armas[a[0]]=(armas[a[0]]||0)+1 } });
    const top = Object.entries(armas).sort((a,b)=>b[1]-a[1]);
    const areas = {};
    feitas.forEach(x=>{ const a=areas[x.q.area]||(areas[x.q.area]={t:0,a:0}); a.t++; if(x.m.r===x.q.gab) a.a++ });
    const melhorQueTurma = feitas.filter(x=>x.m.r===x.q.gab && x.m.pct!=null && x.m.pct<50).length;
    let h = `<div class="panel hero"><h1>Seu desempenho</h1><p>${feitas.length} questões com gabarito até agora</p>
      <div class="stat"><div><b>${ac}</b>acertos</div><div><b>${resp-ac}</b>erros</div><div><b>${feitas.length-resp}</b>sem resposta</div></div></div>`;
    const habs = {};
    feitas.forEach(x=>{ const k=x.q.h.split(" · ")[0]; const a=habs[k]||(habs[k]={t:0,a:0}); a.t++; if(x.m.r===x.q.gab) a.a++ });
    h += `<div class="panel"><p class="big">Por área</p><ul class="list">`+Object.entries(areas).map(([n,v])=>`<li><span class="dot ${v.a===v.t?"ok":v.a?"na":"no"}">${v.a}/${v.t}</span><span>${esc(n)}</span></li>`).join("")+`</ul></div>`;
    if(Object.keys(habs).length>1) h += `<div class="panel"><p class="big">Por habilidade</p><ul class="list">`+Object.entries(habs).sort((a,b)=>parseInt(a[0].slice(1))-parseInt(b[0].slice(1))).map(([n,v])=>`<li><span class="dot ${v.a===v.t?"ok":v.a?"na":"no"}">${v.a}/${v.t}</span><span>${esc(n)}</span></li>`).join("")+`</ul></div>`;
    if(top.length){
      const [k,n] = top[0];
      h += `<div class="panel" style="--hc:var(--amber)"><p class="big">A armadilha que mais pegou você</p><div class="trap"><b>${esc(ARM[k].nome)}</b> · caiu ${n} ${n>1?"vezes":"vez"}<br>${esc(ARM[k].dica)}</div>`;
      if(top.length>1) h += `<p class="small muted" style="margin-top:10px">Também: `+top.slice(1).map(([k,n])=>`${ARM[k].nome} (${n})`).join(" · ")+`</p>`;
      h += `</div>`;
    } else if(resp){

    return h;
  }

  const FRASES = [
    [100,["Gabaritou o aulão. Agora é repetir no ENEM.","Nota máxima. Feito para liderar."]],

  function dadosCartao(){

    const tot=feitas.length, ac=feitas.filter(x=>x.m.r===x.q.gab).length;
    const pct = tot?Math.round(ac*100/tot):0;
    const g={}; feitas.forEach(x=>{const k=x.q.area;const a=g[k]||(g[k]={t:0,a:0});a.t++;if(x.m.r===x.q.gab)a.a++});
    let destaque=null; const ks=Object.keys(g);
    if(ks.length>1){ const [n,v]=Object.entries(g).sort((a,b)=>(b[1].a/b[1].t)-(a[1].a/a[1].t)||b[1].a-a[1].a)[0]; if(v.a) destaque=`Destaque: ${n} · ${v.a}/${v.t}` }
    else { const hb={}; feitas.forEach(x=>{const k=x.q.h.split(" · ")[0];const a=hb[k]||(hb[k]={t:0,a:0});a.t++;if(x.m.r===x.q.gab)a.a++});
      const e=Object.entries(hb).filter(([,v])=>v.t>1).sort((a,b)=>(b[1].a/b[1].t)-(a[1].a/a[1].t))[0]; if(e&&e[1].a) destaque=`Destaque: ${ks[0]||""} ${e[0]} · ${e[1].a}/${e[1].t}` }
    const eu=E&&E.rk?E.rk[EU.d8]:null;
    const noPod = eu && (E.pod||[]).some(p=>p.d===EU.d8);
    if(noPod && eu[0]<=5) destaque = ["🥇","🥈","🥉","🏅","🏅"][eu[0]-1]+` ${eu[0]}º lugar · Top 5 do aulão`;

    const lista = FRASES.find(([m])=>pct>=m)[1];
    let hsh=0; for(const ch of dev+sessao) hsh=(hsh*31+ch.charCodeAt(0))>>>0;

  let cartaoURL=null, cartaoBlob=null, cartaoChave="";
  function quebra(ctx,txt,larg){ const p=txt.split(" "),l=[];let at=""; p.forEach(w=>{const t=at?at+" "+w:w; if(ctx.measureText(t).width>larg&&at){l.push(at);at=w}else at=t}); if(at)l.push(at); return l }
  async function geraCartao(){
    const D=dadosCartao(); const ch=JSON.stringify(D); if(ch===cartaoChave && cartaoURL) return;

    const W=1080,H=1920,c=document.createElement("canvas"); c.width=W;c.height=H; const x=c.getContext("2d");

      h += `<div class="panel hero"><h1>Você está dentro! ✅</h1><p>Deixe esta página aberta. Quando o professor liberar uma questão, ela aparece aqui sozinha.</p></div>
        <div class="codinome"><span class="bx">${EU.bx}</span><span><span class="small">Seu codinome secreto</span><b>${esc(EU.nome)}</b><span class="small">Só você sabe que é você. Se ele subir ao pódio, tem brinde.</span></span></div>

      if(Object.values(minhas).some(m=>m.revelada)) h += `<button class="btn" data-a="resumo">Ver meu desempenho</button>`;

    } else if(E.fase==="fechada"){
      h += `<div class="panel"><p class="big">Votação encerrada</p><div class="alts">`+LET.map(l=>`<button class="alt" disabled aria-pressed="${m&&m.r===l}">${l}</button>`).join("")+`</div>
        <p class="status">${m?`Você marcou <b>${m.r}</b>.`:"Você não respondeu esta."} ${esc(fr("fechada",dev+E.q))}</p></div>`;

      const tot = E.total||0; const pct = tot?Math.round((E.cont?.[q.gab]||0)*100/tot):null;
      if(m && !m.revelada){ m.revelada=true; m.pct=pct; salvar() }
      if(!m){ minhas[E.q]={r:null,revelada:true,pct,tarde:true}; salvar() }
      const mm = minhas[E.q];
      if(!mm.ord){ mm.ord=Date.now(); salvar() }
      const ok = mm.r===q.gab;

      else if(ok){
        const seq = Object.values(minhas).filter(x=>x.revelada&&x.ord).sort((a,b)=>b.ord-a.ord); let n=0;
        for(const x of seq){ const qi=Object.keys(minhas).find(k=>minhas[k]===x); if(x.r && x.r===Q[qi].gab) n++; else break }
        titulo = n>=5 ? fr("seq5",sem,{n}) : n>=3 ? fr("seq3",sem) : (pct!=null && pct<35 && tot>=4) ? fr("raro",sem,{p:pct}) : fr("acerto",sem);
      } else titulo = (pct!=null && pct<35 && tot>=4) ? fr("todos",sem) : fr("erro",sem);
      h += `<div class="res ${!mm.r?"nada":ok?"ok":"no"}"><p class="big">${esc(titulo)}</p>
        <p style="margin:0">Gabarito: <b>${q.gab}</b>${mm.r?` · você marcou <b>${mm.r}</b>`:""}</p>`;
      if(mm.r && !ok){ const a=q.arm[mm.r]; if(a) h += `<div class="trap"><b>Armadilha: ${esc(ARM[a[0]].nome)}</b><br>${esc(a[1])}<br><span class="small">Dica: ${esc(ARM[a[0]].dica)}</span></div>` }

      const outras = LET.filter(l=>q.arm[l] && l!==mm.r);
      if(outras.length) h += `<div class="panel" style="--hc:var(--tang)"><p class="big">Por que as outras enganam</p><ul class="list">`+outras.map(l=>`<li><span class="dot">${l}</span><span><b>${esc(ARM[q.arm[l][0]].nome)}</b> · ${esc(q.arm[l][1])}</span></li>`).join("")+`</ul></div>`;
      if(tot) h += `<div class="panel" style="--hc:var(--violet)"><p class="big">Como a turma respondeu</p><p class="small muted" style="margin:0">${tot} respostas · ${pct}% acertaram</p>${barras(E.cont,q.gab,tot)}</div>`;
      h += `<div class="alts" style="display:none"></div>`;
      h += `<div class="row"><button class="btn" data-a="resumo">Ver meu desempenho</button><button class="btn tang" data-a="share">Compartilhar meu resultado</button></div>`;

  $("#app").addEventListener("click",e=>{
    const b = e.target.closest("[data-l]"); if(b && !b.disabled){ marcar(b.dataset.l); return }

    if(a.dataset.a==="voltar"){ verResumo=false; desenha() }

  });
  $("#layer").addEventListener("click",e=>{ if(e.target.closest('[data-a="share"]')) compartilhar() });

  function recebe(e){
    if(!E && e && e.rl) LS.set("aulao_rl",e.rl);   // página acabou de abrir: já é a versão nova
    if(E && e.v && E.v && e.v < E.v) return;   // ignora estado mais velho
    conexao="ok"; clearTimeout(prazo);
    if(!e.s) e.s="inicial";
    // professor pediu para atualizar o app: recarrega uma vez (respostas e histórico ficam guardados no celular)
    if(e.rl && E){ const visto=LS.get("aulao_rl",0);
      if(e.rl>visto){ LS.set("aulao_rl",e.rl); salvar(); setTimeout(()=>{ const u=new URL(location.href); u.searchParams.set("r",e.rl); location.replace(u.toString()) }, 300+Math.random()*4000); }
    }
    if(sessao!==e.s){ sessao=e.s; minhas = LS.get(chave(sessao),{}); setTimeout(batida,300) }
    const mudouQ = !E || E.q!==e.q || E.fase!==e.fase;
    E = e;
    if(mudouQ){ verResumo=false; fecharFolha(); if(E.fase!=="fim"&&E.fase!=="podio"){ clearTimeout(convT); const c=$(".convite"); if(c) c.remove() } }
    desenha();
    if(mudouQ && E.fase==="aberta") window.scrollTo(0,0);
    enviarPendentes();
    // pré-carrega a imagem da próxima questão
    const prox = Q[E.q>=0?E.q+1:0]; if(prox) prox.img.forEach(f=>{const i=new Image();i.src="./"+f});
    if(!window._poema){ window._poema=new Image(); window._poema.src="poema-memoria.jpg" }
  }
  let prazo = setTimeout(()=>{ if(!E){ $("#app").innerHTML=`<div class="wrap"><div class="panel"><p class="big">A conexão está lenta</p><p class="muted">Continuamos tentando sozinhos. Se demorar, confira o Wi-Fi ou os dados móveis e toque abaixo.</p><button class="btn solid" onclick="location.reload()">Tentar de novo</button></div></div>` } }, 12000);
  addEventListener("offline",()=>{conexao="off";desenha()});
  addEventListener("online",()=>{conexao="ok";desenha()});

  // ao voltar para a tela (celular desbloqueado, aba de volta), busca o estado na hora
  let buscando=false;
  async function acordar(){ if(buscando||document.hidden) return; buscando=true; try{ const e=await comPrazo(BE.buscar(),8000); if(e) recebe(e) }catch(x){} buscando=false }
  document.addEventListener("visibilitychange",acordar); addEventListener("focus",acordar); addEventListener("pageshow",acordar); addEventListener("online",acordar);
  // rede de segurança: confere o estado a cada 20 s com a tela ligada (caso a escuta ao vivo trave na rede da escola)
  setInterval(()=>{ if(!document.hidden && !MOCK) acordar() }, 20000);
  BE.iniciar(false).then(()=>BE.onEstado(recebe,()=>{conexao="off";desenha()})).catch(()=>{
    clearTimeout(prazo);
    $("#app").innerHTML=`<div class="wrap"><div class="panel"><p class="big">Não consegui conectar</p><p class="muted">Confira a internet e tente de novo.</p><button class="btn solid" onclick="location.reload()">Tentar de novo</button></div></div>`;
  });
}

/* ====================== PROFESSOR ====================== */
function professor(){
  document.title = "Aulão ENEM · Painel do professor";
  let E = null, resps = [], desliga = null, ouvindoK = null, verParcial = false, telao = false;
  let hist = LS.get("prof_hist",{});   // sessao -> {i: {cont,total}}
  let pres = [], presK = null, presDesliga = null;
  const msT = t => !t ? Date.now() : typeof t==="number" ? t : t.toMillis ? t.toMillis() : Date.now();
  function vivos(){ const lim=Date.now()-90000, v=new Set(pres.filter(p=>msT(p.t)>=lim).map(p=>p.d));
    if(E && E.fase!=="espera" && E.fase!=="fim") resps.forEach(r=>v.add(r.d)); return v }
  function online(){ return vivos().size }
  function ouvirPres(){ const k=E.s+"_on"; if(presK===k) return; if(presDesliga) presDesliga(); pres=[]; presK=k; presDesliga=BE.ouvirRespostas(k,l=>{pres=l; atualizaOnline()}) }
  function atualizaOnline(){ const n=online(), t=new Set([...pres.map(p=>p.d),...vivos()]).size;
    document.querySelectorAll("[data-online]").forEach(el=>el.textContent = el.dataset.online==="curto" ? `👥 ${n}` : `${n} conectado${n===1?"":"s"} agora${t>n?` · ${t} entraram`:""}`) }
  setInterval(atualizaOnline, 10000);
  let sessAtual = LS.get("prof_sess","hoje"); if(!SESSOES.some(x=>x.id===sessAtual)) sessAtual="hoje";
  let minha = LS.get("prof_minha",[]).filter(i=>Q[i]);
  const S = () => SESSOES.find(x=>x.id===sessAtual);
  function ordem(ss){ ss=ss||S(); if(ss.minha) return minha.slice(); if(ss.grupos) return ss.grupos.flatMap(g=>g.itens); return ss.itens.slice() }
  function proxima(){ const o=ordem(); const p=o.indexOf(E.q); return p<0 ? o[0] : o[p+1] }

  function loginTela(msg){
    $("#app").innerHTML = `<div class="wrap"><div class="panel"><p class="big">Painel do professor</p>
      <input id="pw" type="password" placeholder="Senha do professor" autocomplete="current-password">
      <button class="btn solid" id="ent">Entrar</button><p class="small" style="color:var(--danger)">${esc(msg||"")}</p></div></div>`;
    const entrar = async ()=>{
      $("#ent").disabled=true; $("#ent").textContent="Entrando…";
      try{ await comPrazo(BE.login(PROF_EMAIL,$("#pw").value),15000); comecar() }
      catch(e){ loginTela("Senha errada ou sem internet. Tente de novo.") }
    };
    $("#ent").onclick = entrar;
    $("#pw").onkeydown = e=>{ if(e.key==="Enter") entrar() };
  }
  function contar(){
    const cont={A:0,B:0,C:0,D:0,E:0}; resps.forEach(r=>{ if(cont[r.r]!=null) cont[r.r]++ }); return {cont,total:resps.length};
  }
  function ouvir(i){
    const k = E.s+"_"+i;
    if(ouvindoK===k) return;
    if(desliga) desliga(); resps=[]; ouvindoK=k;
    desliga = BE.ouvirRespostas(k, lista=>{ resps=lista; desenha() });
  }
  async function muda(novo){
    const e = {...E, ...novo, v: Date.now()};
    try{ await comPrazo(BE.setEstado(e),12000) }catch(err){ toast("Falhou ao enviar. Confira a internet e toque de novo."); return }
  }
  async function liberar(i){ podioTelao=false; await muda({q:i,fase:"aberta",cont:null,total:0,ab:Date.now()}); }
  async function encerrar(){ const c=contar(); await muda({fase:"fechada",cont:c.cont,total:c.total}); guardaHist(E.q,c) }
  async function gabarito(){ await muda({fase:"gabarito"}) }
  function guardaHist(i,c){
    const r={}; resps.forEach(x=>{ if(x.d && LET.includes(x.r)) r[x.d]=[x.r, Math.max(0,msT(x.t)-(E.ab||E.v||Date.now()))] });
    (hist[E.s]||(hist[E.s]={}))[i]={...c,r}; LS.set("prof_hist",hist) }
  // ranking: acertos nas questões já encerradas; desempate pelo tempo médio de resposta nos acertos
  function ranking(){
    const hs=hist[E.s]||{}, P={}; let nq=0;
    Object.entries(hs).forEach(([i,v])=>{ const q=Q[i]; if(!q||!v.r) return; nq++;
      Object.entries(v.r).forEach(([d,[l,ms]])=>{ const p=P[d]||(P[d]={d,ac:0,t:0,n:0}); p.n++; if(l===q.gab){ p.ac++; p.t+=ms } }) });
    const L=Object.values(P).sort((a,b)=>b.ac-a.ac || (a.t/(a.ac||1))-(b.t/(b.ac||1)));
    L.forEach((p,k)=>{ Object.assign(p,codinome(p.d)); p.pos=k+1 });
    return {L,nq};
  }
  const MED=["🥇","🥈","🥉"];
  function podioState(){
    const {L,nq}=ranking(); const pv=Date.now();
    const rk={}; L.forEach(p=>rk[p.d8]=[p.pos,p.ac]);
    return {pod:L.filter(p=>p.ac>0).slice(0,8).map(p=>({bx:p.bx,nome:p.nome,ac:p.ac,d:p.d8})), rk, nq, np:L.length, pv};
  }
  let podioTelao=false;

  function qrDataURL(txt){
    try{ const qr=qrcode(0,"M"); qr.addData(txt); qr.make(); return qr.createDataURL(10,2) }catch(e){ return "" }
  }
  const urlAluno = location.origin + location.pathname.replace(/index\.html$/,"") + (MOCK?"?mock=1":"");

  function blocos(){
    const ss=S();
    if(ss.grupos) return ss.grupos.map(g=>({area:g.t,cor:"#7862AD",itens:g.itens}));
    const out=[]; ordem(ss).forEach(i=>{ const q=Q[i]; const u=out[out.length-1]; if(u && u.area===q.area) u.itens.push(i); else out.push({area:q.area,cor:q.cor,itens:[i]}) });
    return out;
  }
  const difTag = q => q.dif ? `<span class="dif ${q.dif==="Difícil"?"d":q.dif==="Fácil"?"f":"m"}">${esc(q.dif)}</span>` : "";
  function desenha(){
    if(!E) return;
    const q = Q[E.q];
    const c = contar();
    const hs = hist[E.s]||{};
    const fases = {espera:"Aguardando",aberta:"Votação aberta",fechada:"Votação encerrada",gabarito:"Gabarito liberado",fim:"Aulão finalizado",mensagem:"Poema na tela",podio:"Pódio na tela"};
    let h = `<div class="top"><img class="marca" src="marca.jpg" alt="Genoma Prevê"><b>Painel do professor</b><span class="sp"></span><span class="pill on" data-online="curto" title="Alunos com a página aberta agora">👥 ${online()}</span><span class="pill ${E.fase==="aberta"?"ok":"warn"}">${fases[E.fase]||E.fase}</span>${botaoTema()}</div><div class="wrap pwrap">`;
    // ---- AGORA ----
    if(q && E.fase!=="espera" && E.fase!=="fim" && E.fase!=="podio"){
      const mostrar = E.fase==="aberta" ? verParcial : true;
      const cc = E.fase==="aberta"?c.cont:E.cont; const tt=E.fase==="aberta"?c.total:E.total;
      h += `<div class="panel agora" style="--hc:${q.cor}"><p class="big">Agora · ${esc(q.area)}</p>
        <div class="agora-g"><div><img class="slide" src="./${q.img[q.img.length-1]}" data-zoom="./${q.img[q.img.length-1]}" alt="Prévia da questão"><p class="zoomhint">Toque para ampliar</p></div>
        <div>${qtitulo(q)}
          <div class="row" style="align-items:flex-end;margin:6px 0 4px"><div><div class="count">${E.fase==="aberta"?c.total:(E.total||0)}</div><div class="muted small">${E.fase==="aberta"?"responderam até agora":"respostas contadas"} · <span data-online></span></div></div>
          <div style="text-align:right"><span class="pill gab">Gabarito ${q.gab}</span></div></div>`;
      if(E.fase==="aberta") h += `<button class="btn tang" data-a="encerrar">Encerrar votação</button>`;
      if(E.fase==="fechada") h += `<button class="btn solid" data-a="gab">Mostrar gabarito aos alunos</button>`;
      const px = proxima();
      if(E.fase==="gabarito" && px!=null) h += `<button class="btn solid" data-a="prox">Liberar a próxima: ${esc(Q[px].area)} · Q${Q[px].num} →</button>`;
      if(E.fase==="gabarito" && px==null) h += `<button class="btn solid" data-a="fim">Fim da sessão “${esc(S().nome)}” · Finalizar aulão</button>`;
      if(E.fase==="aberta") h += `<button class="btn" data-a="parcial">${verParcial?"Esconder":"Ver"} parcial (só para você)</button>`;
      if(mostrar) h += barras(cc,q.gab,tt);
      h += `<button class="btn" data-a="telao">Abrir modo telão</button></div></div></div>`;
    } else if(E.fase==="espera"){
      h += `<div class="panel hero"><h1>Pronto para começar</h1><p>Os alunos entram pelo QR code e ficam aguardando. Sessão escolhida: <b>${esc(S().nome)}</b>.</p><p style="font-size:22px;font-weight:800;margin:10px 0 0" data-online></p>${Object.keys(hs).length?`<p class="small" style="margin:10px 0 0;background:rgba(255,255,255,.12);padding:10px 12px;border-radius:10px">⚠️ Ainda há ${Object.keys(hs).length} questões de um aulão anterior guardadas. Para o pódio e o desempenho dos alunos começarem do zero, toque em <b>Começar aulão novo</b>.</p><button class="btn" data-a="zerar" style="margin-top:8px;background:#fff;color:var(--g-dark)">Começar aulão novo (zera respostas e pódio)</button>`:""}
        <div class="row" style="margin-top:12px">${ordem().length?`<button class="btn tang" data-a="lib" data-i="${ordem()[0]}">Liberar a primeira: ${esc(Q[ordem()[0]].area)} · Q${Q[ordem()[0]].num}</button>`:`<button class="btn" disabled style="color:#fff">Escolha questões em “Minha seleção”</button>`}<button class="btn" data-a="telao" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)">Modo telão (QR code)</button></div></div>`;
    } else if(E.fase==="podio"){
      h += `<div class="panel hero"><h1>O pódio está nos celulares 🏆</h1><p>O top 5 vê a tela dourada de brinde; do 6º ao 8º, a tela de menção honrosa. Cada um tem um código de conferência: confira no quadro do pódio antes de entregar.</p>
        <button class="btn tang" data-a="sempod">Tirar o pódio e voltar ${E.prev&&E.prev.fase!=="espera"&&Q[E.prev.q]?`para a Q${Q[E.prev.q].num}`:"para o aguarde"}</button><button class="btn" data-a="fim" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)">Finalizar aulão (relatório e cartão)</button></div>`;
    } else if(E.fase==="mensagem"){
      h += `<div class="panel hero"><h1>O poema está nos celulares 💚</h1><p>Sem alternativas para marcar. Quando quiser, volte para onde estava.</p>
        <button class="btn tang" data-a="semmsg">Tirar o poema e voltar ${E.prev&&E.prev.fase!=="espera"&&Q[E.prev.q]?`para a Q${Q[E.prev.q].num}`:"para o aguarde"}</button>${E.prev&&E.prev.fase==="fim"?"":`<button class="btn" data-a="fim" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)">Finalizar aulão (relatório e cartão)</button>`}</div>`;
    } else if(E.fase==="fim"){
      h += `<div class="panel hero"><h1>Aulão finalizado</h1><p>Os alunos estão vendo o relatório final no celular.</p></div>`;
    }
    { const {L,nq}=ranking();
      h += `<div class="panel" style="--hc:#E9A11A"><p class="big">🏆 Pódio · ranking anônimo</p>`;
      if(!nq) h += `<p class="small muted" style="margin:0">O ranking começa quando você encerrar a primeira votação. Conta só as questões trabalhadas, então dá para mostrar o pódio a qualquer momento.</p>`;
      else {
        h += `<p class="small muted" style="margin:0 0 6px">${nq} ${nq===1?"questão encerrada":"questões encerradas"} · ${L.length} participantes · top 5 + 3 menções honrosas · empate pelo tempo de resposta</p><ul class="rank">`+
          L.slice(0,10).map(p=>`<li style="${p.pos===6?"border-top:2px dashed var(--line)":""}"><span class="ps">${p.pos<=3?MED[p.pos-1]:p.pos+"º"}</span><span class="bx">${p.bx}</span><b>${esc(p.nome)}</b>${p.pos>5&&p.pos<=8?`<span class="small muted">· menção</span>`:""}${E.fase==="podio"&&p.pos<=8&&p.ac>0?`<span class="small muted">· conf. ${hashS(p.d8+E.pv)%9000+1000}</span>`:""}<span class="ac">${p.ac}/${nq}</span></li>`).join("")+`</ul>
          <div class="row" style="margin-top:10px"><button class="btn" data-a="podtelao">Mostrar pódio só no telão</button><button class="btn tang" data-a="podcel">${E.fase==="podio"?"Atualizar pódio nos celulares":"Mostrar pódio nos celulares"}</button></div>`;
        if(E.fase==="podio") h += `<button class="btn solid" data-a="sempod">Tirar o pódio dos celulares e voltar</button>`;
      }
      h += `</div>`; }
    // ---- ROTEIRO POR MATÉRIA ----
    h += `<h2 class="sec">Sessões</h2><div class="tabs">`+SESSOES.map(ss=>{const o=ordem(ss);const f=o.filter(i=>hs[i]).length;
      return `<button class="tab" data-a="sess" data-s="${ss.id}" aria-pressed="${ss.id===sessAtual}">${esc(ss.nome)}<small>${o.length} questões${f?` · ${f} feitas`:""}</small></button>`}).join("")+`</div>
      <p class="sdesc">${esc(S().desc)}</p>`;
    if(S().minha && !minha.length) h += `<div class="panel"><p class="big">Sua seleção está vazia</p><p class="muted" style="margin:0">Abra “Aulão de hoje” ou “Literatura por habilidade” e toque na ☆ das questões que quer trabalhar. Elas aparecem aqui, na ordem em que você marcar.</p></div>`;
    if(S().minha && minha.length) h += `<button class="btn" data-a="limpa" style="width:auto;display:inline-block;padding:8px 14px;min-height:40px">Limpar seleção</button>`;
    blocos().forEach(bl=>{
      const feitas = bl.itens.filter(i=>hs[i]).length;
      h += `<div class="panel bloco" style="--hc:${bl.cor}"><div class="bloco-h"><span class="area" style="background:${bl.cor}">${esc(bl.area)}</span><span class="muted small">${feitas}/${bl.itens.length} feitas</span></div><div class="cards">`;
      bl.itens.forEach(i=>{
        const qq=Q[i], v=hs[i], cur=(i===E.q && E.fase!=="espera" && E.fase!=="fim");
        const p = v&&v.total?Math.round((v.cont[qq.gab]||0)*100/v.total):null;
        const st = cur?`<span class="pill ok">● Agora</span>`:v?`<span class="pill">${p}% acertaram</span>`:`<span class="pill">Não liberada</span>`;
        const on=minha.includes(i);
        h += `<div class="qcard ${cur?"cur":""} ${v&&!cur?"done":""}"><button class="star" data-a="star" data-i="${i}" aria-pressed="${on}" aria-label="${on?"Tirar da":"Pôr na"} minha seleção">${on?"★":"☆"}</button>
          <div class="thumb" data-zoom="./${qq.img[qq.img.length-1]}"><img loading="lazy" src="./${qq.img[qq.img.length-1]}" alt="Prévia Q${qq.num}"></div>
          <div class="qinfo"><b>${S().minha?esc(qq.area)+" · ":""}Questão ${qq.num}</b>${difTag(qq)} <span class="small muted">· ${esc(qq.h)} · gab. ${qq.gab}</span><div class="small">${esc(qq.tema)}</div><div style="margin-top:6px">${st}</div></div>
          <button class="btn ${cur?"":"solid"} mini" data-a="lib" data-i="${i}" ${cur?"disabled":""}>${cur?"Em andamento":v?"Liberar de novo":"Liberar"}</button></div>`;
      });
      h += `</div></div>`;
    });
    // ---- RESUMO ----
    const feitas = Object.keys(hs);
    if(feitas.length){
      h += `<div class="panel" style="--hc:var(--tang)"><p class="big">Resumo da turma</p><ul class="list">`+feitas.sort((a,b)=>a-b).map(i=>{const qq=Q[i],v=hs[i];const p=v.total?Math.round((v.cont[qq.gab]||0)*100/v.total):0;
        const errMais = LET.filter(l=>l!==qq.gab).sort((a,b)=>(v.cont[b]||0)-(v.cont[a]||0))[0];
        return `<li><span class="dot ${p>=60?"ok":p>=40?"na":"no"}" style="min-width:46px">${p}%</span><span><b>${esc(qq.area)} · Q${qq.num}</b> · ${v.total} resp.<br><span class="small muted">Distrator mais marcado: ${errMais} (${v.total?Math.round((v.cont[errMais]||0)*100/v.total):0}%)${qq.arm[errMais]?" · "+ARM[qq.arm[errMais][0]].nome:""}</span></span></li>`}).join("")+`</ul></div>`;
    }
    if(E.fase!=="mensagem") h += `<div class="panel" style="--hc:var(--tang)"><p class="big">Surpresa da despedida</p><div class="row" style="align-items:center"><img src="poema-memoria.jpg" alt="" style="width:84px;flex:0 0 84px;border-radius:8px;border:1px solid var(--line)"><p class="small muted" style="margin:0;flex:1">“Memória”, de Carlos Drummond de Andrade, com “Com amor, Paulo”. Aparece em tela cheia no celular dos alunos, sem alternativas. Ninguém vê antes de você tocar.</p></div><button class="btn tang" data-a="msg">Mostrar o poema nos celulares</button></div>`;
    h += `<div class="panel" style="--hc:var(--muted)"><p class="big">Controle geral</p>
      <div class="row"><button class="btn" data-a="espera">Pôr todos em “aguarde”</button>${E.fase!=="fim"?`<button class="btn" data-a="fim">Finalizar aulão</button>`:""}</div>
      <button class="btn" data-a="atualiza">Atualizar o app nos celulares (não perde respostas)</button>
      <button class="btn danger" data-a="zerar">Zerar tudo (nova sessão, para depois do teste)</button>
      <p class="small muted">Link dos alunos: <b>${esc(urlAluno)}</b></p></div><img class="logo-g" src="logo.jpg" alt="Genoma Sistema de Ensino"></div>`;
    render(h); atualizaOnline();
    if(telao) desenhaTelao();
  }
  function desenhaTelao(){
    let t = $("#telao"); if(!t){ t=document.createElement("div"); t.id="telao"; document.body.appendChild(t) }
    t.classList.add("on");
    if(!(podioTelao || E.fase==="podio")) t._hp=null;
    const q = Q[E.q]; const c = contar();
    const qr = qrDataURL(urlAluno);
    let esq = "";
    if(podioTelao || E.fase==="podio"){
      const {L,nq}=ranking();
      const deg=(function(P){
        const d3=P.slice(0,3).map((p,k)=>`<div class="deg d${k+1}"><div class="bx">${p.bx}</div><div class="nm">${esc(p.nome)}</div><div class="pt">${p.ac} de ${nq} acertos</div><div class="bloco">${k+1}º</div></div>`).join("");
        const q45=P.slice(3,5).map((p,k)=>`<div><span class="ps">${k+4}º</span><span>${p.bx}</span><span><span class="nm">${esc(p.nome)}</span><br><span class="pt">${p.ac} ${p.ac===1?"acerto":"acertos"}</span></span></div>`).join("");
        const men=P.slice(5,8).map(p=>`<li>${p.bx}<b>${esc(p.nome)}</b><span>${p.ac} ${p.ac===1?"acerto":"acertos"}</span></li>`).join("");
        return d3+`</div>`+(q45?`<div class="quase">${q45}</div>`:"")+(men?`<div class="mencoes"><p class="lbl">Menções honrosas</p><ul>${men}</ul></div>`:"")+`<div>`;
      })(L.filter(p=>p.ac>0));
      const cs=["#FFD866","#E7632D","#ffffff","#7FD1A8","#F2A33A"]; let cf=`<div class="confete">`; for(let k=0;k<70;k++){const r=hashS(k+"t"); cf+=`<i style="left:${r%100}%;background:${cs[r%cs.length]};width:1.2vh;height:1.8vh;animation-duration:${3+(r%40)/10}s;animation-delay:${-(r%50)/10}s"></i>`} cf+=`</div>`;
      const hp=`<button class="btn close" data-t="sair" style="z-index:10">Sair do telão ✕</button><div class="tpod">${cf}<img class="marca" src="marca.jpg" alt="Genoma Prevê" style="position:relative;z-index:2;height:5vh;margin-top:1vh"><h1 style="position:relative;z-index:2">🏆 Pódio do aulão</h1><p style="font-size:3vh;margin:0;opacity:.8;position:relative;z-index:2">${nq} questões · ${L.length} participantes · confira seu codinome no celular</p><div class="degraus">${deg}</div></div>`;
      if(t._hp!==hp){ t._hp=hp; t.innerHTML=hp }
      return;
    }
    if(!q || E.fase==="espera"){ esq = `<h1>Aulão ENEM</h1><p style="font-size:3.5vh">Aponte a câmera para o QR code e deixe a página aberta.</p><p style="font-size:5vh;font-weight:800;margin:2vh 0 0" data-online></p>` }
    else if(E.fase==="aberta"){ esq = `<h1>${esc(q.area)} · Questão ${q.num}</h1><p style="font-size:3vh" class="muted">Votação aberta</p><div class="count">${c.total}</div><p style="font-size:3.5vh;margin:0">responderam · <span data-online></span></p>` }
    else if(E.fase==="fechada"){ esq = `<h1>${esc(q.area)} · Questão ${q.num}</h1><p style="font-size:3vh" class="muted">Votação encerrada · ${E.total} respostas</p>${barras(E.cont,null,E.total)}` }
    else if(E.fase==="gabarito"){ esq = `<h1>${esc(q.area)} · Questão ${q.num} · Gabarito ${q.gab}</h1><p style="font-size:3vh" class="muted">${E.total} respostas</p>${barras(E.cont,q.gab,E.total)}` }
    else if(E.fase==="mensagem"){ esq = `<h1>Para vocês, turma 💚</h1><p style="font-size:4vh;font-style:italic">Com amor, Paulo</p>`; t.innerHTML=`<button class="btn close" data-t="sair">Sair do telão ✕</button><div class="tg"><div><img class="marca" src="marca.jpg" alt="Genoma Prevê">${esq}</div><div><img class="poema" src="poema-memoria.jpg" alt="Poema"></div></div>`; return }
    else { esq = `<h1>Fim do aulão</h1><p style="font-size:4vh">Confiram o relatório no celular. Boa prova!</p>` }
    setTimeout(atualizaOnline,0);
    t.innerHTML = `<button class="btn close" data-t="sair">Sair do telão ✕</button><div class="tg"><div><img class="marca" src="marca.jpg" alt="Genoma Prevê">${esq}</div><div class="qr">${qr?`<img src="${qr}" alt="QR code">`:""}<div class="url">${esc(urlAluno.replace(/^https?:\/\//,""))}</div></div></div>`;
  }
  document.addEventListener("click",e=>{ if(e.target.closest('[data-t="sair"]')){ telao=false; podioTelao=false; $("#telao").classList.remove("on") } });

  $("#app").addEventListener("click", async e=>{
    const b = e.target.closest("[data-a]"); if(!b) return;
    const a = b.dataset.a;
    if(a==="lib"){ const i=+b.dataset.i; if(E.fase==="aberta" && i!==E.q && !confirm("A votação atual ainda está aberta. Liberar outra questão mesmo assim?")) return; await liberar(i) }
    if(a==="encerrar") await encerrar();
    if(a==="gab") await gabarito();
    if(a==="prox"){ const px=proxima(); if(px!=null) await liberar(px) }
    if(a==="sess"){ sessAtual=b.dataset.s; LS.set("prof_sess",sessAtual); desenha(); return }
    if(a==="star"){ const i=+b.dataset.i; minha = minha.includes(i)?minha.filter(x=>x!==i):[...minha,i]; LS.set("prof_minha",minha); toast(minha.includes(i)?`Q${Q[i].num} na sua seleção (${minha.length})`:`Q${Q[i].num} saiu da seleção`); desenha(); return }
    if(a==="limpa"){ if(confirm("Limpar a sua seleção?")){ minha=[]; LS.set("prof_minha",minha); desenha() } return }
    if(a==="fim"){ if(confirm("Finalizar o aulão? Os alunos verão o relatório final.")) await muda({fase:"fim"}) }
    if(a==="espera") await muda({fase:"espera"});
    if(a==="msg"){ if(confirm("Mostrar o poema agora no celular de todos?")) await muda({fase:"mensagem",q:-1,prev:E.fase==="podio"?E.prev:{q:E.q,fase:E.fase}}) }
    if(a==="podtelao"){ podioTelao=true; telao=true; desenhaTelao(); return }
    if(a==="podcel"){ if(E.fase==="podio" || confirm("Mostrar o pódio agora no celular de todos?")){ const ps=podioState(); await muda(E.fase==="podio"?ps:{...ps,fase:"podio",prev:{q:E.q,fase:E.fase}}); podioTelao=true; if(telao) desenhaTelao() } return }
    if(a==="sempod"){ const p=E.prev||{q:-1,fase:"espera"}; podioTelao=false; await muda({q:p.q,fase:p.fase,prev:null}); return }
    if(a==="semmsg"){ const p=E.prev||{q:-1,fase:"espera"}; await muda({q:p.q,fase:p.fase,prev:null}) }
    if(a==="atualiza"){ if(confirm("Recarregar a página nos celulares? Cada aluno volta para onde está agora, com as respostas e o desempenho guardados.")){ await muda({rl:Date.now()}); toast("Pedido enviado. Os celulares recarregam nos próximos segundos.") } }
    if(a==="parcial"){ verParcial=!verParcial; desenha() }
    if(a==="telao"){ telao=true; desenhaTelao() }
    if(a==="zerar"){ if(confirm("Zerar tudo? Começa uma sessão nova: os celulares dos alunos também começam do zero.")){ await muda({s:"s"+Date.now().toString(36),q:-1,fase:"espera",cont:null,total:0,pod:null,rk:null,prev:null}) } }
  });

  async function comecar(){
    $("#app").innerHTML = `<div class="wrap"><div class="panel"><p class="big">Conectando…</p></div></div>`;
    BE.onEstado(e=>{
      if(!e.s) e.s="inicial";
      E = e; ouvirPres();
      if(E.q>=0 && E.fase!=="espera" && E.fase!=="fim") ouvir(E.q);
      desenha();
    }, ()=>toast("Sem conexão com o servidor. Tentando de novo…"));
  }

  const qrS = document.createElement("script"); qrS.src="qr.js"; document.head.appendChild(qrS);
  BE.iniciar(true).then(async ()=>{
    const u = await comPrazo(BE.usuarioAtual(),10000).catch(()=>null);
    if(u) comecar(); else loginTela();
  }).catch(()=>{ $("#app").innerHTML=`<div class="wrap"><div class="panel"><p class="big">Não consegui conectar</p><button class="btn solid" onclick="location.reload()">Tentar de novo</button></div></div>` });
}

aplicaTema();
if(!MOCK && (!FB_CFG.apiKey || /COLE/.test(FB_CFG.apiKey))){
  $("#app").innerHTML=`<div class="wrap"><div class="panel"><p class="big">Falta configurar</p><p class="muted">Abra o arquivo config.js, cole o firebaseConfig do seu projeto e publique de novo.</p></div></div>`;
} else if(MODO==="prof") professor(); else aluno();
</script>
</body>
</html>
