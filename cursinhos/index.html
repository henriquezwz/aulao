<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opiniões sobre cursinhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--verde:#0B5C3B;--ouro:#B8860B;--lar:#B33A20;--fundo:#F5F3EC;--txt:#1d2a23;--sub:#66706a;--borda:#e4e0d3}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--fundo);color:var(--txt)}
header{background:var(--verde);color:#fff;padding:26px 16px 22px}
header .in{max-width:760px;margin:0 auto}
header h1{margin:0 0 6px;font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
header p{margin:0;opacity:.85;font-size:.93rem;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:14px}
input,select,textarea,button{font:inherit}
.nome{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:10px 12px;margin:-28px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 14px rgba(11,92,59,.08)}
.nome input[type=text],.nome #nome{flex:1;min-width:120px;border:1px solid var(--borda);border-radius:9px;padding:9px}
.barra{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.barra input,.barra select{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--borda);border-radius:10px;background:#fff}
h2{font-size:1.02rem;color:var(--verde);margin:22px 4px 8px;font-weight:800}
.rank{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:6px 14px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--borda)}
.rk:last-child{border:0}
.pos{font-family:"JetBrains Mono",monospace;font-weight:600;width:26px;color:var(--sub)}
.rk:nth-child(1) .pos{color:var(--ouro)}.rk:nth-child(2) .pos{color:#8a8f95}.rk:nth-child(3) .pos{color:var(--lar)}
.rk .nm{flex:1}.rk .nm small{display:block;color:var(--sub);font-size:.78rem}
.card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.media{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.86rem;white-space:nowrap}
.media .n,.rk .n{font-family:"JetBrains Mono",monospace;color:var(--ouro);font-weight:600;font-size:1rem}
.corpo{margin-top:10px;border-top:1px solid var(--borda);padding-top:10px;display:none}
.card.aberto .corpo{display:block}
.estrelas button{background:none;border:0;font-size:1.7rem;color:#d9d4c3;cursor:pointer;padding:2px}
.estrelas button.on{color:var(--ouro)}
textarea{width:100%;min-height:70px;border:1px solid var(--borda);border-radius:9px;padding:9px;margin-top:6px}
.salvar{margin-top:6px;background:var(--lar);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
.salvar:active{transform:scale(.97)}
.op{font-size:.92rem;padding:9px 0;border-top:1px dashed var(--borda);line-height:1.4}
.op .q{color:var(--ouro)}
.aviso{color:var(--sub);font-size:.86rem;text-align:center;padding:10px}
.sec{margin:10px 0 4px}
.sec h2{display:flex;align-items:center;gap:8px}
.sec h2 span{font-family:"JetBrains Mono",monospace;font-size:.75rem;color:var(--sub);background:#ebe7da;border-radius:20px;padding:2px 8px}
.sec.dest{background:linear-gradient(160deg,#0B5C3B,#13774d);border-radius:20px;padding:6px 12px 10px;margin:22px 0}
.sec.dest h2{color:#fff}.sec.dest h2 span{background:rgba(255,255,255,.18);color:#fff}
.sec.dest .card{border-color:transparent}
.selo{display:inline-block;margin-left:8px;font-size:.7rem;font-weight:600;color:#fff;background:var(--ouro);border-radius:20px;padding:2px 8px;vertical-align:middle}
.site{display:inline-block;margin-bottom:10px;color:var(--verde);font-weight:600;text-decoration:none;border:1.5px solid var(--verde);border-radius:10px;padding:7px 12px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.nav a{flex:none;text-decoration:none;color:var(--verde);background:#fff;border:1px solid var(--borda);border-radius:20px;padding:6px 12px;font-size:.85rem;font-weight:600}
.card{transition:box-shadow .15s}.card.aberto{box-shadow:0 6px 18px rgba(11,92,59,.10)}
.topo b{font-weight:600}
.sobre{background:#f3efe2;border-radius:10px;padding:9px 11px;font-size:.86rem;color:#4b5550;line-height:1.4;margin-bottom:10px}.sobre b{color:var(--verde)}
</style>
</head>
<body>
<header><div class="in"><h1>Cursinhos: o que os estudantes acham</h1><p>Veja os mais recomendados, leia experiências reais e deixe a sua antes de aproveitar a Black Friday.</p></div></header>
<main>
<div class="nome"><span>Seu nome:</span><input id="nome" placeholder="Opcional (em branco = anônimo)"><label style="white-space:nowrap;font-size:.9rem"><input type="checkbox" id="anon"> Anônimo</label></div>
<div class="barra">
<input id="busca" placeholder="Buscar curso">
<select id="ordem"><option value="lista">Ordem da lista</option><option value="nota">Melhor nota</option><option value="qtd">Mais avaliados</option></select>
</div>
<div id="status" class="aviso">Carregando opiniões…</div>
<h2>Mais recomendados</h2><div id="rank" class="rank"><div class="aviso">Ainda sem avaliações. Seja o primeiro!</div></div>
<h2 style="margin-top:26px">Por área</h2><nav id="nav" class="nav"></nav>
<div id="lista"></div>
<footer style="text-align:center;color:var(--sub);font-size:.8rem;padding:28px 0 20px">Plataforma criada pelo <a href="https://nogabarito.com.br" target="_blank" rel="noopener" style="color:var(--sub)">No Gabarito</a></footer>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAOFKVqVGS_JDichlaHDA5iwa4VBH9plic",
  authDomain: "bingo-portugues.firebaseapp.com",
  databaseURL: "https://bingo-portugues-default-rtdb.firebaseio.com",
  projectId: "bingo-portugues",
  storageBucket: "bingo-portugues.firebasestorage.app",
  messagingSenderId: "637348287930",
  appId: "1:637348287930:web:70c31a72d9b56670f2f983",
  measurementId: "G-J75C0C6ND9"
};
const CAT={
"Plataformas de questões":["Hospital Questiona","AIO","Estuda.com","nogabarito.com.br"],
"Química":["Iquimica","Discursivas de química","Babi Correa","Tathi na química","Moisés Medeiros"],
"Biologia":["Bioatp","Discursivas de bio","Neuralia","Ferretto (Landim)","Gui Goulart","Emmanoel (Gordinho das Aprovações, do Medway)"],
"Física":["Universo narrado – lições de física","Ricci","Rafael Medeiros"],
"Linguagens":["Lauro","Fernanda Pessoa","Autoria","Felipe Pereira"],
"Matemática":["Matemagicando","Universo narrado","Mente matemática do professor Fredão","Plataforma discursiva de matemática","Ronaebson","Mateco","Matemática MC","Matemática Online","Vital Matemática"],
"Redação":["Fernanda Pessoa","Autoria","Corrija-me","Aníbal de Redação","Jana Rabelo","Bella Nazar","Luma e ponto","Aula da Marcella"],
"Plataformas de correção":["Fernanda Pessoa","Corrija-me","Tanay"],
"Humanas":["Thais Formagio","PRD","Filonared","Humanizarte","História Online","Terra Negra","Humanizando","Edu Morais"]};
const key=(c,n)=>(c+"__"+n).normalize("NFD").replace(/[^\w]+/g,"_").toLowerCase();
let todas={}, meuId=null, db=null, abertos=new Set(), rasc={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{$("nome").value=localStorage.getItem("nome")||""}catch(e){}
$("anon").onchange=e=>{$("nome").disabled=e.target.checked};
$("nome").oninput=e=>{try{localStorage.setItem("nome",e.target.value)}catch(_){}};
$("busca").oninput=render;$("ordem").onchange=render;

function stats(k){const ops=[];for(const uid in todas){const r=(todas[uid].r||{})[k];if(r&&r.nota)ops.push({...r,uid,nome:todas[uid].nome||"Anônimo"})}
const m=ops.length?ops.reduce((a,o)=>a+o.nota,0)/ops.length:0;return{ops,m}}
function renderRank(){const vis=new Set(),arr=[];for(const c in CAT)for(const n of CAT[c]){const st=stats(key(c,n));if(!st.ops.length)continue;const id=n.toLowerCase();if(vis.has(id+c))continue;vis.add(id+c);arr.push({n,c,...st})}
const tot=arr.reduce((a,x)=>a+x.ops.length,0),g=tot?arr.reduce((a,x)=>a+x.m*x.ops.length,0)/tot:0;
arr.forEach(x=>x.sc=(x.m*x.ops.length+g*3)/(x.ops.length+3));arr.sort((a,b)=>b.sc-a.sc||b.ops.length-a.ops.length);
if(!arr.length)return;$("rank").innerHTML=arr.slice(0,10).map((x,i)=>`<div class="rk"><span class="pos">${i+1}º</span><span class="nm">${esc(x.n)}<small>${x.c}</small></span><span class="media"><span class="n">${x.m.toFixed(1)}</span> ★ · ${x.ops.length}</span></div>`).join("")}
function render(){
const q=$("busca").value.trim().toLowerCase(),ord=$("ordem").value;let h="";
for(const c in CAT){let itens=CAT[c].map((n,i)=>({n,i,k:key(c,n),...stats(key(c,n))})).filter(x=>x.n.toLowerCase().includes(q));
if(!itens.length)continue;
if(ord==="nota")itens.sort((a,b)=>b.m-a.m||b.ops.length-a.ops.length);
if(ord==="qtd")itens.sort((a,b)=>b.ops.length-a.ops.length);
const ks=itens.filter(x=>x.ops.length);const best=ks.length?ks.reduce((a,b)=>b.m*b.ops.length/(b.ops.length+1)>a.m*a.ops.length/(a.ops.length+1)?b:a):null;itens.forEach(x=>x.top=x===best);
h+=`<section class="sec"><h2>${c}<span>${CAT[c].length}</span></h2>`;
for(const x of itens){const meu=(todas[meuId]?.r||{})[x.k]||{};const d=rasc[x.k]||{nota:meu.nota||0,txt:meu.txt||""};
h+=`<div class="card ${abertos.has(x.k)?"aberto":""}" data-k="${x.k}"><div class="topo" data-t="${x.k}"><b>${esc(x.n)}${x.top?'<span class="selo">Mais bem avaliado</span>':""}</b><span class="media">${x.ops.length?`<span class="n">${x.m.toFixed(1)}</span> ★ · ${x.ops.length} opini${x.ops.length>1?"ões":"ão"}`:"sem opiniões"}</span></div>
<div class="corpo">${x.n==="nogabarito.com.br"?'<div class="sobre"><b>Do criador</b> · Em lançamento. Todas as questões do ENEM (2009 a 2026) e discursivas da Fuvest, Unicamp, Unesp e PISM, com resolução comentada, coach com IA e correção de discursivas pelos critérios da banca. Hoje é tudo gratuito; em 2027 terá versão grátis e assinatura de R$ 19,90.</div><a class="site" href="https://nogabarito.com.br" target="_blank" rel="noopener">Visitar nogabarito.com.br ↗</a>':""}${db?`<div class="estrelas">${[1,2,3,4,5].map(s=>`<button data-s="${s}" data-k="${x.k}" class="${s<=d.nota?"on":""}" aria-label="${s} estrelas">★</button>`).join("")}</div>
<textarea data-x="${x.k}" placeholder="O que achou? Preço, didática, material…">${esc(d.txt)}</textarea><button class="salvar" data-v="${x.k}">Salvar opinião</button>`:""}
${x.ops.map(o=>`<div class="op"><b>${esc(o.nome)}</b> <span class="q">${"★".repeat(o.nota)}</span><br>${esc(o.txt||"")}</div>`).join("")}</div></div>`}h+=`</section>`}
renderRank();$("lista").innerHTML=h||`<div class="aviso">Nada encontrado.</div>`}
document.addEventListener("click",async e=>{const t=e.target;
if(t.dataset.t){abertos.has(t.dataset.t)?abertos.delete(t.dataset.t):abertos.add(t.dataset.t);render();return}
const tp=t.closest&&t.closest(".topo");if(tp){const k=tp.dataset.t;abertos.has(k)?abertos.delete(k):abertos.add(k);render();return}
if(t.dataset.s){const k=t.dataset.k;rasc[k]={...(rasc[k]||{txt:document.querySelector(`[data-x="${k}"]`).value}),nota:+t.dataset.s};render();return}
if(t.dataset.v){const k=t.dataset.v,txt=document.querySelector(`[data-x="${k}"]`).value.trim();const nota=(rasc[k]||{}).nota||((todas[meuId]?.r||{})[k]||{}).nota;
if(!nota){alertMsg("Escolha uma nota de 1 a 5.");return}const anon=$("anon").checked;const nome=(anon?"":$("nome").value.trim())||"Anônimo";
const atual=todas[meuId]||{r:{}};const r={...(atual.r||{}),[k]:{nota,txt}};t.textContent="Salvando…";
try{await set(ref(db,"cursinhos/"+meuId),{nome,r});delete rasc[k];abertos.delete(k);render();}catch(err){alertMsg("Não deu para salvar. Tente de novo.")}}});
function alertMsg(m){$("status").textContent=m;$("status").style.display="block";setTimeout(()=>{$("status").style.display="none"},3000)}
document.addEventListener("input",e=>{const k=e.target.dataset.x;if(k){rasc[k]={...(rasc[k]||{nota:((todas[meuId]?.r||{})[k]||{}).nota||0}),txt:e.target.value}}});
$("nav").innerHTML=Object.keys(CAT).map((c,i)=>`<a href="#" data-c="${i}">${c}</a>`).join("");
$("nav").onclick=e=>{const i=e.target.dataset.c;if(i==null)return;e.preventDefault();document.querySelectorAll(".sec")[i]?.scrollIntoView({behavior:"smooth"})};
render();
const timer=setTimeout(()=>{$("status").textContent="Não foi possível carregar as opiniões agora."},10000);
try{meuId=localStorage.getItem("uid")}catch(e){}
if(!meuId){meuId="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);try{localStorage.setItem("uid",meuId)}catch(e){}}
db=getDatabase(initializeApp(firebaseConfig));
onValue(ref(db,"cursinhos"),snap=>{clearTimeout(timer);todas=snap.val()||{};$("status").style.display="none";render()},()=>{clearTimeout(timer);$("status").textContent="Erro ao carregar opiniões."});
</script>
</body>
</html>
